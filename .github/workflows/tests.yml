# Every push and pull request: all tests, no model calls (fast and free).
# The secrets below are throwaway values for the test run only.
name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    name: API (NestJS + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eyeClinicAssistant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant_test?schema=public
      AUTH_SECRET: ci-only-auth-secret
      AGENT_TOKEN_SECRET: ci-only-agent-token-secret
      AGENT_URL: http://localhost:8001
      AGENT_SERVICE_KEY: ci-only-agent-service-key
      DEMO_MODE: 'true'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Create the test database (the tests apply migrations themselves)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE "eyeClinicAssistant_test"'
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx oxlint src test prisma
      - name: Unit and database tests
        run: npx vitest run
      - name: HTTP tests
        run: npm run test:e2e

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  browser:
    name: Browser (Playwright, scripted agent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eyeClinicAssistant_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for this run only. The API's other settings are in e2e/playwright.config.ts.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant_e2e?schema=public
      # The API's install step (prisma generate) needs one set; the same e2e database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant_e2e?schema=public
      SEED_PATIENT_PASSWORD: ci-only-patient-password
      SEED_STAFF_PASSWORD: ci-only-staff-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      # The runner image already has the system libraries Chromium needs (it ships Chrome);
      # --with-deps would apt-get them from Ubuntu's mirrors, which failed twice in a row.
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install chromium
      - name: Browser tests (migrate, seed, start API + web + scripted agent, run)
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report, screenshots and traces when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
