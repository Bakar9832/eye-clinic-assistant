# Graded conversations against the real agent and a real model. Uses model quota, so it
# runs nightly and on demand, not on every push. Fails when the pass rate is below 80%.
#
# Needs, in the repository's Settings → Secrets and variables → Actions:
#   secret   LLM_API_KEY
#   variable LLM_BASE_URL, LLM_MODEL, and optionally LLM_FALLBACK_MODEL
name: Evals

on:
  schedule:
    - cron: '30 2 * * *' # every night, 02:30 UTC
  workflow_dispatch:
    inputs:
      variant:
        description: Prompt to evaluate
        type: choice
        options: [full, minimal]
        default: full
      repeats:
        description: Runs per case (a case passes on a majority)
        default: '1'

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eyeClinicAssistant_eval
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant_eval?schema=public
      EVAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eyeClinicAssistant_eval?schema=public
      AUTH_SECRET: ci-only-auth-secret
      AGENT_TOKEN_SECRET: ci-only-agent-token-secret
      AGENT_SERVICE_KEY: ci-only-agent-service-key
      AGENT_URL: http://127.0.0.1:8999
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
      EVAL_MAX_LLM_CALLS_PER_MINUTE: '12'
      EVAL_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install the API
        working-directory: api
        run: npm ci
      - name: Install the agent
        working-directory: agent
        run: pip install -e .
      - name: Run the evals
        working-directory: api
        # The evals database URL must differ from DATABASE_URL for the safety check.
        run: DATABASE_URL="${DATABASE_URL/_eval/_unused}" npm run eval -- --variant "${{ inputs.variant || 'full' }}" --repeats "${{ inputs.repeats || '1' }}" --threshold 0.8
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ inputs.variant || 'full' }}
          path: api/evals/results/
