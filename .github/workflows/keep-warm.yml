# Keeps the free Render services (API and agent) awake during US daytime, so visitors
# don't wait a minute for a cold start. See docs/keep-warm.md for the plan and the hours.
#
# Calls GET /health/warm on the API every 10 minutes: no login, no database, no model.
# The URL is the repository variable KEEP_WARM_URL (Settings → Secrets and variables →
# Actions → Variables); without it the job does nothing.
name: Keep warm

on:
  schedule:
    # Every 10 minutes, 14:00–00:59 UTC (11 hours): 10:00–21:00 US Eastern in summer,
    # 09:00–20:00 in winter. Odd minutes, because GitHub delays runs on the hour.
    - cron: '3-59/10 14-23 * * *'
    - cron: '3-59/10 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health/warm
        env:
          URL: ${{ vars.KEEP_WARM_URL }}
        run: |
          if [ -z "$URL" ]; then echo "KEEP_WARM_URL is not set; nothing to do."; exit 0; fi
          # A sleeping API can take about a minute to answer; the request itself wakes it.
          curl -sS --max-time 90 -H 'Cache-Control: no-cache' "$URL" || echo "No answer in time (still waking); the next run will check again."
