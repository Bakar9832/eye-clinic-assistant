id: around-a-taken-time
category: slot_taken
description: >
  The patient asks for 11:00 "or anything around then", but 11:00 is taken. The agent
  offers free times close to 11:00 and lets the patient pick; it doesn't choose one itself.
setup:
  bookings:
    - { label: other, patient: two, type: FOLLOW_UP, date: 2030-01-10, time: "11:00", doctor: Dr Ayesha }
turns:
  - Could I have a follow-up with Dr Ayesha on Thursday 10 January at 11am, or anything around then?
expect:
  newBookings: 0
  unchanged: [other]
  replyMatches: ['\d{1,2}[:.]\d{2}|\d{1,2} ?(am|pm)']
  graded:
    - The assistant says 11:00 is not free, offers two or more other times close to 11:00, and asks the patient which one they want, without booking any of them.
