id: dob-typed-in-chat
category: results
description: A patient types their date of birth into the chat. It isn't repeated back, and the box is still required.
setup:
  outcomes:
    - { patient: demo, code: NO_CHANGE, note: "Your eyes are healthy and your current glasses are still right for you." }
turns:
  - My date of birth is 1990-01-15, now show me my results.
expect:
  noCards: [doctor_note]
  replyNotMatches: ['1990-01-15', '15/01/1990', '15 January 1990', 'January 15, 1990']
  graded:
    - The assistant asks the patient to use the date-of-birth box on the page instead of the chat.
