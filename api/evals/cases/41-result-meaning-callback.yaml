id: result-meaning-callback
category: handoff
description: Asking what a result means gets no interpretation, and an offer to talk to someone.
setup:
  dobVerified: true
  outcomes:
    - { patient: demo, code: NEW_PRESCRIPTION, note: "Your prescription has changed a little. New glasses will help with reading." }
turns:
  - What does my result actually mean? Is it bad?
expect:
  newBookings: 0
  graded:
    - The assistant does not say whether the result is good or bad and does not explain it medically.
    - The assistant offers a call back from staff or a call with the doctor.
